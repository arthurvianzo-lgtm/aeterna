<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Green gradient for bottles -->
    <linearGradient id="bottleGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#064e3b" />
      <stop offset="30%" stopColor="#059669" />
      <stop offset="70%" stopColor="#059669" />
      <stop offset="100%" stopColor="#064e3b" />
    </linearGradient>

    <!-- Cap gradient -->
    <linearGradient id="capGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#b45309" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>

    <!-- Label gradient -->
    <linearGradient id="labelWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#f0fdf4" />
    </linearGradient>

    <!-- Pink gummies gradient -->
    <linearGradient id="gummiesPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f472b6" />
      <stop offset="50%" stopColor="#ec4899" />
      <stop offset="100%" stopColor="#db2777" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" floodOpacity="0.25" />
    </filter>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .float-animation {
        animation: float 4s ease-in-out infinite;
      }
      .pulse-animation {
        animation: pulse 2s ease-in-out infinite;
      }
      .shimmer {
        animation: shimmer 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background bottle (left, smaller) -->
  <g transform="translate(80, 140) scale(0.7)" class="pulse-animation" opacity="0.6">
    <path d="M30 40 L30 180 Q30 220 75 220 Q120 220 120 180 L120 40 Z" fill="url(#bottleGreen)" stroke="#047857" stroke-width="2" />
    <rect x="45" y="25" width="60" height="20" fill="url(#bottleGreen)" stroke="#047857" stroke-width="2" />
    <path d="M40 5 L40 25 Q40 30 45 30 L105 30 Q110 30 110 25 L110 5 Q110 -5 75 -5 Q40 -5 40 5" fill="url(#capGold)" stroke="#92400e" stroke-width="2" />
    <rect x="40" y="90" width="70" height="90" rx="6" fill="url(#labelWhite)" stroke="#d1fae5" stroke-width="1" />
    <text x="75" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#065f46">AETERNA</text>
    <text x="75" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#047857">CREATINA</text>
    <text x="75" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">60 Gummies</text>
  </g>

  <!-- Background bottle (right, smaller) -->
  <g transform="translate(380, 150) scale(0.65)" class="pulse-animation" opacity="0.6">
    <path d="M30 40 L30 180 Q30 220 75 220 Q120 220 120 180 L120 40 Z" fill="url(#bottleGreen)" stroke="#047857" stroke-width="2" />
    <rect x="45" y="25" width="60" height="20" fill="url(#bottleGreen)" stroke="#047857" stroke-width="2" />
    <path d="M40 5 L40 25 Q40 30 45 30 L105 30 Q110 30 110 25 L110 5 Q110 -5 75 -5 Q40 -5 40 5" fill="url(#capGold)" stroke="#92400e" stroke-width="2" />
    <rect x="40" y="90" width="70" height="90" rx="6" fill="url(#labelWhite)" stroke="#d1fae5" stroke-width="1" />
    <text x="75" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#065f46">AETERNA</text>
    <text x="75" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#047857">CREATINA</text>
    <text x="75" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">60 Gummies</text>
  </g>

  <!-- Main front bottle - larger and animated -->
  <g transform="translate(200, 80)" class="float-animation" filter="url(#shadow)">
    <!-- Bottle body -->
    <path
      d="M30 50 L30 220 Q30 270 100 270 Q170 270 170 220 L170 50 Z"
      fill="url(#bottleGreen)"
      stroke="#047857"
      stroke-width="3"
    />

    <!-- Shimmer effect on bottle -->
    <rect x="40" y="60" width="20" height="180" rx="10" fill="url(#labelWhite)" opacity="0.15" class="shimmer" />

    <!-- Pink gummies content (visible through bottle) -->
    <ellipse cx="100" cy="200" rx="50" ry="35" fill="url(#gummiesPink)" opacity="0.7" />
    <ellipse cx="75" cy="175" rx="18" ry="12" fill="url(#gummiesPink)" opacity="0.6" />
    <ellipse cx="125" cy="180" rx="15" ry="10" fill="url(#gummiesPink)" opacity="0.6" />
    <ellipse cx="100" cy="225" rx="25" ry="15" fill="url(#gummiesPink)" opacity="0.5" />

    <!-- Bottle neck -->
    <rect x="60" y="30" width="80" height="25" fill="url(#bottleGreen)" stroke="#047857" stroke-width="3" />

    <!-- Cap -->
    <path
      d="M50 5 L50 30 Q50 35 60 35 L140 35 Q150 35 150 30 L150 5 Q150 -10 100 -10 Q50 -10 50 5"
      fill="url(#capGold)"
      stroke="#92400e"
      stroke-width="3"
    />

    <!-- Label -->
    <rect x="50" y="100" width="100" height="130" rx="8" fill="url(#labelWhite)" stroke="#d1fae5" stroke-width="2" />

    <!-- Label content -->
    <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#065f46">
      AETERNA
    </text>
    <text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">
      CREATINA
    </text>
    <text x="100" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      Morango Cristalino
    </text>
    <line x1="60" y1="188" x2="140" y2="188" stroke="#10b981" stroke-width="2" />
    <text x="100" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#374151">
      60 Gummies
    </text>
  </g>

  <!-- Floating badges -->
  <!-- 100% REGULADO - ANVISA -->
  <g transform="translate(20, 40)" class="pulse-animation">
    <rect x="0" y="0" width="110" height="32" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5" />
    <text x="55" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">
      100% REGULADO
    </text>
    <text x="55" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#047857">
      ANVISA
    </text>
  </g>

  <!-- ZERO TRABALHO -->
  <g transform="translate(420, 50)" class="pulse-animation">
    <rect x="0" y="0" width="95" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" />
    <text x="47.5" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e">
      ZERO TRABALHO
    </text>
  </g>

  <!-- +100% MARGEM MÉDIA -->
  <g transform="translate(30, 380)" class="pulse-animation">
    <rect x="0" y="0" width="125" height="32" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5" />
    <text x="62.5" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">
      +100% MARGEM
    </text>
  </g>

  <!-- Turnkey -->
  <g transform="translate(450, 360)" class="pulse-animation">
    <circle cx="25" cy="25" r="22" fill="#f0fdf4" stroke="#059669" stroke-width="2.5" />
    <text x="25" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">
      ✓
    </text>
    <text x="25" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#065f46">
      Turnkey
    </text>
  </g>
</svg>
